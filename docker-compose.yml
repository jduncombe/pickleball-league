services:
  api:
    build: ./api
    environment:
      DATABASE_URL: sqlite:////data/pickleball.db
      ROOT_PATH: /api
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./web
    environment:
      # nginx serves the static site and proxies /api/* here (container network).
      API_URL: http://api:8000
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
