services:
  api:
    build: ./api
    environment:
      DATABASE_URL: sqlite:////data/pickleball.db
      ROOT_PATH: /api
      APP_NAME: ${APP_NAME:-Pickleball League}
      # The brand's terminology table, so API messages use the same words as the UI.
      TERMS_FILE: /brands/${BRAND:-default}/terms.json
      # Auth master key (docs/auth.md). Unset, one is generated into the data volume.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_SECRET_FILE: /data/auth_secret
      # The session cookie is Secure: fine on http://localhost, but set
      # COOKIE_SECURE=false to sign in over plain http from another host.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Browsers come through the web container's nginx (one proxy hop).
      TRUSTED_PROXY_HOPS: "1"
    volumes:
      - api-data:/data
      - ./web/brands:/brands:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      args:
        # White-label brand folder in web/brands/ (e.g. BRAND=example docker compose up --build)
        BRAND: ${BRAND:-default}
    environment:
      # nginx serves the static site and proxies /api/* here (container network).
      API_URL: http://api:8000
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
