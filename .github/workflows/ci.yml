name: CI

# Pushes to main run these checks through deploy.yml, which calls this
# workflow and only deploys once they pass.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: "1.16.4"

jobs:
  api:
    name: API tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pickleball
          POSTGRES_PASSWORD: pickleball
          POSTGRES_DB: pickleball_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pickleball"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://pickleball:pickleball@localhost:5432/pickleball_test' || '' }}

  web:
    name: Web type check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check static export
        run: test -f out/index.html && test -f out/league/teams/index.html && test -f out/404.html

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: terraform fmt -check -recursive infra
      - name: Validate bootstrap stack
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate and test app stack (mocked AWS provider)
        working-directory: infra/app
        run: terraform init -backend=false -input=false && terraform validate && terraform test
      - name: CloudFront function tests
        run: node --test infra/app/functions/functions.test.mjs
